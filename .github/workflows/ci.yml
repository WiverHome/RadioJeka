# Сборка, юнит-тесты и тесты интерфейса на эмуляторе на каждый push в main и каждый PR.
# Секреты не нужны: без keystore.properties релизная подпись не используется, собирается debug.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Кэш ~/.gradle (зависимости, обёртка, плагины)
      - uses: gradle/actions/setup-gradle@v6

      # Юнит-тесты лежат в app/src/test; новые подхватятся сами
      - name: Сборка debug и юнит-тесты
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --console=plain

  ui-tests:
    name: Тесты интерфейса на эмуляторе
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # Без KVM эмулятор на Linux работает в десятки раз медленнее
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Тесты лежат в app/src/androidTest; эмулятор Android 14 запускается и выключается сам
      - name: Тесты интерфейса
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: chmod +x gradlew && ./gradlew connectedDebugAndroidTest --console=plain
